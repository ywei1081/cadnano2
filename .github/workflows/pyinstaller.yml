name: pyinstaller build

on:
  push:
    branches:
      - '**'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: install-dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller pillow pyqt6-tools
        python -m pip install .
        pip list
      shell: cmd
    - name: build-bundle
      run:
        python -m PyInstaller --onefile --name cadnano --add-data "cadnano2;cadnano2" --hidden-import PyQt6.QtSvg --hidden-import PyQt6.sip --icon cadnano2/ui/mainwindow/images/cadnano2-app-icon.png .github/entry.py
      shell: cmd
    - uses: actions/upload-artifact@v7
      with:
        name: cadnano-windows
        path: dist/cadnano.exe

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: cadnano-macos
          - os: macos-15-intel
            artifact_name: cadnano-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: install-dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller pillow
        python -m pip install .
        pip list
      # PyQt6 == 6.11.0 PyQt6-Qt6==6.11.0 PyQt6-sip==13.11.1
    - name: build-bundle
      run:
        python -m PyInstaller --onefile --name cadnano --add-data "cadnano2:cadnano2" --hidden-import PyQt6.QtSvg --hidden-import PyQt6.sip --icon cadnano2/ui/mainwindow/images/cadnano2-app-icon.png .github/entry.py
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/cadnano

  build-linux:
    runs-on: ubuntu-latest
    # glibc compatiblity issue at lower linux distro
    container: python:3.9-buster
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - uses: actions/checkout@v6
    - name: install-dependencies
      run: |
        echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
        echo "deb http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
        apt-get update
        apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-* libx11-xcb1 libatk1.0-0 libgtk-3-0
        python3 -m pip install --upgrade pip
        python3 -m pip install pyinstaller pillow pyqt6-tools
        python3 -m pip install .
        pip list
    - name: build-bundle
      run: |
        python3 -m PyInstaller --onefile --name cadnano --add-data "cadnano2:cadnano2" --hidden-import PyQt6.QtSvg --hidden-import PyQt6.sip .github/entry.py
    - uses: actions/upload-artifact@v7
      with:
        name: cadnano-linux
        path: dist/cadnano
